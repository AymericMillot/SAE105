<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catalogue complet des SAÉ d'Aymeric Millot : fiches détaillées, compétences associées et livrables téléchargeables.">
    <title>Portefolio – Liste des SAÉ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>

<body class="directory-page">
    <header class="site-header">
        <a class="logo" href="index.html" aria-label="Retour à l'accueil">AM</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="#sae-list">Parcourir les SAÉ</a>
        </nav>
    </header>

    <main>
        <section class="directory-hero" aria-labelledby="directory-title">
            <p class="eyebrow">Sélection de projets</p>
            <h1 id="directory-title">Explorer les SAÉ du BUT MMI</h1>
            <p class="lead">Chaque projet illustre mes compétences en communication, développement et design. Utilisez la recherche pour
                filtrer les fiches et accéder rapidement aux ressources clés.</p>
            <div class="search-panel" role="search">
                <label for="sae-search">Rechercher une SAÉ, une compétence ou une ressource</label>
                <input id="sae-search" type="search" placeholder="Exemple : communication, développement…" autocomplete="off">
                <p id="result-count" aria-live="polite"></p>
            </div>
        </section>

        <section id="sae-list" class="sae-directory" aria-live="polite">
            <div class="sae-grid" aria-label="Cartes des SAÉ"></div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" integrity="sha512-93mYaqk7HX/IpYRXl2vlA38nSxrdbidKdvUSsfx8bVsgcuyo6edSxnl2xe50Tzw9uQWGWpZJYG1ChB7rR0PeQw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/dataSAE.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
